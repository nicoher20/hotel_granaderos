        Consultar Ahora

      <!-- Botón Menú Móvil -->

        <i data-lucide="menu" class="w-6 h-6"></i>

    </div>

    <!-- Menú Desplegable Móvil -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-amber-100 bg-white px-4 pt-2 pb-6 space-y-3">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-6">
